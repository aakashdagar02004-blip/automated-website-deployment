<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Deployment Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #243247;
            text-align: center;
            padding: 60px 20px;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 { color: #1769aa; }
        .status {
            color: #218838;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Automated Website</h1>
        <p>Welcome to my DevOps deployment project.</p>
        <p>This website is being deployed using modern DevOps tools.</p>
        <p class="status">Website status: Running successfully</p>
        <p>Tools: Git, Docker, Ansible, Terraform and AWS EC2</p>
    </div>
</body>
</html>
